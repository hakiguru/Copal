id = "anycubic/abs-like-pro-2-grey"
brand = "Anycubic"
name = "ABS-Like Resin Pro 2"
color = "Grey"
type = "abs-like"

# Settings the project owner prints with. Several figure parts printed well with them.
# Exposure is personal: run the calibration wizard for your own bottle.
[[profiles]]
printer = "elegoo/saturn-4-ultra-16k"
layer_height_mm = 0.03
exposure_s = 1.4                 # 1.3 also printed well
bottom_layers = 5
bottom_exposure_s = 29.0
transition_layers = 5
anti_aliasing = 8
light_pwm = 255

# Waits, in seconds. "rest after retract" = wait before the next exposure.
bottom_rest_after_exposure_s = 0.5
bottom_rest_after_retract_s = 2.0
rest_after_exposure_s = 0.2
rest_after_retract_s = 2.0

# Two-stage motion: [first stage, second stage]. Distances in mm, speeds in mm/min.
bottom_lift_mm = [3.0, 2.0]
bottom_lift_speed = [35.0, 120.0]
bottom_retract_mm = [3.0, 2.0]
bottom_retract_speed = [180.0, 60.0]
lift_mm = [2.0, 1.0]
lift_speed = [45.0, 180.0]
retract_mm = [2.0, 1.0]
retract_speed = [180.0, 60.0]

source = "tested by @hakiguru, 2026-09 (values read from their own sliced files)"
