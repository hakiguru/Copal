name: Publish wiki

# Copies the pages from wiki/ to the GitHub wiki on every push to main.
on:
  push:
    branches: [main]
    paths: ["wiki/**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Push wiki/ to the wiki repo
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git clone "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.wiki.git" wiki-repo
          rsync -a --delete --exclude .git wiki/ wiki-repo/
          cd wiki-repo
          git config user.name "hakiguru"
          git config user.email "262621558+hakiguru@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Wiki is up to date."
            exit 0
          fi
          git commit -m "Update wiki from ${GITHUB_SHA::7}"
          git push
