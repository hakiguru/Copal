name: Release

# Push a tag like v0.1.0 to build everything and publish a GitHub Release.
# The release notes are the matching section of CHANGELOG.md.
on:
  push:
    tags: ["v*"]

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04 # older glibc, so the binaries run on more distros
            target: linux-x86_64
          - os: windows-latest
            target: windows-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --release -p copal -p copal-lite -p copal-cli
      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          DIR="copal-$VERSION-${{ matrix.target }}"
          mkdir "$DIR"
          cp target/release/copal target/release/copal-lite target/release/copal-cli README.md LICENSE "$DIR/"
          tar czf "$DIR.tar.gz" "$DIR"
      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = "$env:GITHUB_REF_NAME".TrimStart("v")
          $dir = "copal-$version-${{ matrix.target }}"
          New-Item -ItemType Directory $dir | Out-Null
          Copy-Item target/release/copal.exe, target/release/copal-lite.exe, target/release/copal-cli.exe, README.md, LICENSE $dir
          Compress-Archive -Path $dir -DestinationPath "$dir.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: |
            copal-*.tar.gz
            copal-*.zip

  publish:
    name: Publish the release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Release notes from CHANGELOG.md
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          awk -v v="$VERSION" '
            /^## / { if (found) exit; if ($2 == v) { found = 1; next } }
            found { print }
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "CHANGELOG.md has no section '## $VERSION'" >&2
            exit 1
          fi
          cat notes.md
      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          FLAGS=""
          case "$VERSION" in 0.*) FLAGS="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "Copal $VERSION" \
            --notes-file notes.md \
            $FLAGS
