name: Release

# A release happens when main gets a new version:
#   1. bump `version` in the root Cargo.toml ([workspace.package]),
#   2. add a `## X.Y.Z` section to CHANGELOG.md,
#   3. push to main.
# This workflow then builds everything, creates the tag vX.Y.Z and publishes a GitHub Release
# with that CHANGELOG section as notes. Pushing a vX.Y.Z tag by hand works too.
on:
  push:
    branches: [main]
    paths: ["Cargo.toml", "CHANGELOG.md"]
    tags: ["v*"]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write

jobs:
  check:
    name: Is there a new version?
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      release: ${{ steps.v.outputs.release }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: v
        run: |
          VERSION=$(awk -F'"' '/^\[workspace.package\]/{p=1} p && /^version *=/{print $2; exit}' Cargo.toml)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" >/dev/null && [ "$GITHUB_REF_TYPE" != tag ]; then
            echo "v$VERSION is already released."
            echo "release=false" >> "$GITHUB_OUTPUT"
          elif ! grep -q "^## $VERSION\b" CHANGELOG.md; then
            echo "CHANGELOG.md has no '## $VERSION' section yet, not releasing."
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "Releasing v$VERSION"
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

  linux:
    name: Linux packages
    needs: check
    if: needs.check.outputs.release == 'true'
    runs-on: ubuntu-22.04 # older glibc, so the binaries run on more distros
    env:
      VERSION: ${{ needs.check.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --release -p copal -p copal-lite -p copal-cli
      - name: Tools for packaging
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q rpm
          curl -sSL -o appimagetool https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool
      - name: Packages (deb, rpm, AppImage, tar.gz, PKGBUILD)
        run: APPIMAGETOOL=$PWD/appimagetool packaging/linux/build-packages.sh "$VERSION" target/release dist
      - name: Files for the Flatpak bundle
        run: |
          F=packaging/flatpak/files
          mkdir -p $F
          cp target/release/copal target/release/copal-lite target/release/copal-cli $F/
          cp packaging/linux/*.desktop packaging/linux/*.mime.xml assets/logo-256.png assets/logo-512.png $F/
          sed -e "s/@VERSION@/$VERSION/" -e "s/@DATE@/$(date -u +%Y-%m-%d)/" \
            packaging/linux/io.github.hakiguru.Copal.metainfo.xml > $F/io.github.hakiguru.Copal.metainfo.xml
          tar -C packaging -czf flatpak-input.tar.gz flatpak
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: flatpak-input
          path: flatpak-input.tar.gz

  flatpak:
    name: Flatpak bundle
    needs: [check, linux]
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:freedesktop-24.08
      options: --privileged
    env:
      VERSION: ${{ needs.check.outputs.version }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: flatpak-input
      - run: tar xzf flatpak-input.tar.gz
      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          manifest-path: flatpak/io.github.hakiguru.Copal.yml
          bundle: copal-${{ needs.check.outputs.version }}.flatpak
          upload-artifact: false
          cache: false
      - uses: actions/upload-artifact@v4
        with:
          name: flatpak
          path: copal-*.flatpak

  windows:
    name: Windows installer
    needs: check
    if: needs.check.outputs.release == 'true'
    runs-on: windows-latest
    env:
      VERSION: ${{ needs.check.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --release -p copal -p copal-lite -p copal-cli
      - name: Portable files
        shell: pwsh
        run: |
          New-Item -ItemType Directory dist | Out-Null
          Copy-Item target/release/copal.exe "dist/Copal-$env:VERSION-portable.exe"
          Copy-Item target/release/copal-lite.exe "dist/Copal-Lite-$env:VERSION-portable.exe"
          $dir = "copal-$env:VERSION-windows-x86_64"
          New-Item -ItemType Directory $dir | Out-Null
          Copy-Item target/release/copal.exe, target/release/copal-lite.exe, target/release/copal-cli.exe, README.md, LICENSE $dir
          Compress-Archive -Path $dir -DestinationPath "dist/$dir.zip"
      - name: Installer
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup --no-progress -y }
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /Q "/DAppVersion=$env:VERSION" "/DBinDir=$PWD\target\release" "/DOutDir=$PWD\dist" packaging\windows\copal.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/*

  publish:
    name: Publish the release
    needs: [check, linux, windows, flatpak]
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.check.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: linux
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: windows
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: flatpak
          path: dist
      - name: Release notes from CHANGELOG.md
        run: |
          awk -v v="$VERSION" '
            /^## / { if (found) exit; if ($2 == v) { found = 1; next } }
            found { print }
          ' CHANGELOG.md > notes.md
          cat packaging/release-notes-footer.md >> notes.md
          cat notes.md
      - name: Create the tag and the GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ls -la dist
          gh release create "v$VERSION" dist/* \
            --target "$GITHUB_SHA" \
            --title "Copal $VERSION" \
            --notes-file notes.md \
            --latest
