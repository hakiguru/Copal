name: Release

# A release happens when main gets a new version:
#   1. bump `version` in the root Cargo.toml ([workspace.package]),
#   2. add a `## X.Y.Z` section to CHANGELOG.md,
#   3. push to main.
# This workflow then builds everything, creates the tag vX.Y.Z and publishes a GitHub Release
# with that CHANGELOG section as notes. Pushing a vX.Y.Z tag by hand works too.
on:
  push:
    branches: [main]
    paths: ["Cargo.toml", "CHANGELOG.md"]
    tags: ["v*"]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write

jobs:
  check:
    name: Is there a new version?
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      release: ${{ steps.v.outputs.release }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: v
        run: |
          VERSION=$(awk -F'"' '/^\[workspace.package\]/{p=1} p && /^version *=/{print $2; exit}' Cargo.toml)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" >/dev/null && [ "$GITHUB_REF_TYPE" != tag ]; then
            echo "v$VERSION is already released."
            echo "release=false" >> "$GITHUB_OUTPUT"
          elif ! grep -q "^## $VERSION\b" CHANGELOG.md; then
            echo "CHANGELOG.md has no '## $VERSION' section yet, not releasing."
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "Releasing v$VERSION"
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Build (${{ matrix.target }})
    needs: check
    if: needs.check.outputs.release == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04 # older glibc, so the binaries run on more distros
            target: linux-x86_64
          - os: windows-latest
            target: windows-x86_64
    runs-on: ${{ matrix.os }}
    env:
      VERSION: ${{ needs.check.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --release -p copal -p copal-lite -p copal-cli
      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          DIR="copal-$VERSION-${{ matrix.target }}"
          mkdir "$DIR"
          cp target/release/copal target/release/copal-lite target/release/copal-cli README.md LICENSE "$DIR/"
          tar czf "$DIR.tar.gz" "$DIR"
      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $dir = "copal-$env:VERSION-${{ matrix.target }}"
          New-Item -ItemType Directory $dir | Out-Null
          Copy-Item target/release/copal.exe, target/release/copal-lite.exe, target/release/copal-cli.exe, README.md, LICENSE $dir
          Compress-Archive -Path $dir -DestinationPath "$dir.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: |
            copal-*.tar.gz
            copal-*.zip

  publish:
    name: Publish the release
    needs: [check, build]
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.check.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Release notes from CHANGELOG.md
        run: |
          awk -v v="$VERSION" '
            /^## / { if (found) exit; if ($2 == v) { found = 1; next } }
            found { print }
          ' CHANGELOG.md > notes.md
          cat notes.md
      - name: Create the tag and the GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          FLAGS=""
          case "$VERSION" in 0.*) FLAGS="--prerelease" ;; esac
          gh release create "v$VERSION" dist/* \
            --target "$GITHUB_SHA" \
            --title "Copal $VERSION" \
            --notes-file notes.md \
            $FLAGS
