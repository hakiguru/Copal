# Copal is MIT. Only permissive licenses are allowed in the dependency tree.
# Run locally with: cargo deny check licenses bans sources

[graph]
all-features = false

[licenses]
confidence-threshold = 0.9
# The list is our policy; not every license on it is used yet.
unused-allowed-license = "allow"
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "BSL-1.0",
    "CC0-1.0",
    "MPL-2.0",
    # Fonts bundled by egui (Ubuntu font and others):
    "OFL-1.1",
    "Ubuntu-font-1.0",
]

[bans]
multiple-versions = "allow"
wildcards = "deny"
# Our own crates depend on each other by path; they are never published.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
