[workspace]
resolver = "3"
members = ["crates/*", "apps/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT"
repository = "https://github.com/hakiguru/Copal"
homepage = "https://github.com/hakiguru/Copal/wiki"
authors = ["hakiguru"]
publish = false

[workspace.dependencies]
copal-core = { path = "crates/copal-core" }
copal-mesh = { path = "crates/copal-mesh" }
copal-supports = { path = "crates/copal-supports" }
copal-slice = { path = "crates/copal-slice" }
copal-formats = { path = "crates/copal-formats" }
copal-presets = { path = "crates/copal-presets" }
copal-net = { path = "crates/copal-net" }
copal-shell = { path = "crates/copal-shell" }
copal-ui-common = { path = "crates/copal-ui-common" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
glam = { version = "0.34", features = ["serde"] }
zip = { version = "9", default-features = false, features = ["deflate"] }
clap = { version = "4", features = ["derive"] }
egui = "0.37"
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
image = { version = "0.25", default-features = false, features = ["png"] }
quick-xml = "0.42"
toml = "1"
rayon = "1"
egui_glow = "0.37"
glow = "0.17"

[workspace.lints.rust]
# Only the OpenGL renderer (crates/copal-ui-common/src/render.rs) may use unsafe.
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

# Slicing is too slow without optimizations, even in debug builds and tests.
[profile.dev.package.copal-slice]
opt-level = 3
[profile.dev.package.copal-formats]
opt-level = 3
[profile.dev.package.copal-mesh]
opt-level = 2
# Dependencies (image, png, zip, egui, …) are built optimized too; our own crates stay quick to build.
[profile.dev.package."*"]
opt-level = 2
